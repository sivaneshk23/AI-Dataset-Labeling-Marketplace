# Render blueprint for the live deployment (Section 9.4).
#
# Create the service with "New +" -> "Blueprint", point Render at this
# repository and it provisions the free PostgreSQL instance and the web service
# together. Every sensitive value is either generated by Render or entered in
# the dashboard - nothing is committed to Git.

services:
  - type: web
    name: ai-dataset-labeling-marketplace-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python scripts/migrate.py && PYTHONPATH=. uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-dataset-labeling-marketplace-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MIN_CONFIDENCE
        value: "0.55"
      - key: RATE_LIMIT_REQUESTS
        value: "240"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: TRUST_PROXY_HEADERS
        value: "true"

databases:
  - name: ai-dataset-labeling-marketplace-db
    plan: free
    region: singapore
    databaseName: dataset_labeling_marketplace
    user: marketplace
